name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines
      - name: Typecheck
        run: yarn typecheck
      - name: Lint
        run: yarn lint
      - name: Run main tests
        run: yarn test:main
      - name: Build main and renderer
        run: yarn build
